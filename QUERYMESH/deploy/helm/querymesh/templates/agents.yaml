{{- range .Values.agents }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: querymesh-{{ .name }}
  labels: {app: querymesh-{{ .name }}}
spec:
  replicas: 1
  selector:
    matchLabels: {app: querymesh-{{ .name }}}
  template:
    metadata:
      labels: {app: querymesh-{{ .name }}}
    spec:
      containers:
        - name: agent
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["python", "-m", "querymesh.agents", "{{ .name }}"]
          ports:
            - containerPort: {{ .port }}
          env:
            - name: PUBLIC_URL
              value: "http://querymesh-{{ .name }}:{{ .port }}"
          envFrom:
            - configMapRef: {name: querymesh-config}
            - secretRef: {name: {{ $.Values.secretName }}}
          readinessProbe:
            httpGet: {path: /healthz, port: {{ .port }}}
            initialDelaySeconds: 5
          resources: {{- toYaml $.Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: querymesh-{{ .name }}
spec:
  selector: {app: querymesh-{{ .name }}}
  ports:
    - port: {{ .port }}
      targetPort: {{ .port }}
{{- end }}
