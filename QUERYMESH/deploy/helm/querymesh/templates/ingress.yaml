{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: querymesh
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: /token
            pathType: Prefix
            backend: {service: {name: querymesh-api, port: {number: 80}}}
          - path: /ask
            pathType: Prefix
            backend: {service: {name: querymesh-api, port: {number: 80}}}
          - path: /healthz
            pathType: Prefix
            backend: {service: {name: querymesh-api, port: {number: 80}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: querymesh-gradio, port: {number: 80}}}
{{- end }}
