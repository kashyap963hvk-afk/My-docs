# Real AWS: an EKS cluster with 2 worker machines, Pod Identity, and the IAM roles the
# AWS Load Balancer Controller and External Secrets Operator need.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: querymesh
  region: us-east-1
  version: "1.35"
vpc:
  nat:
    gateway: Single
iam:
  withOIDC: true
  podIdentityAssociations:
    - namespace: kube-system
      serviceAccountName: aws-load-balancer-controller
      wellKnownPolicies:
        awsLoadBalancerController: true
    - namespace: external-secrets
      serviceAccountName: external-secrets
      permissionPolicyARNs: ["arn:aws:iam::ACCOUNT_ID:policy/QueryMeshSecretsRead"]
addons:
  - name: eks-pod-identity-agent
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
managedNodeGroups:
  - name: ng-general
    instanceType: t3.large
    minSize: 2
    desiredCapacity: 2
    maxSize: 3
    volumeSize: 30
    privateNetworking: true
