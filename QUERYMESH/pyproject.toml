[project]
name = "querymesh"
version = "1.0.0"
description = "QueryMesh: a multi-agent arXiv research assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph==1.2.16",
    "langchain-openai==1.7.2",
    "fastmcp==4.1.3",
    "a2a-sdk[http-server]==1.2.3",
    "opensearch-py==3.2.0",
    "httpx==0.28.1",
    "redis==8.1.0",
    "fastapi==0.157.0",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
    "pyjwt==2.15.1",
    "python-dotenv==1.2.4",
    "logfire[fastapi,httpx]==5.2.0",
    "langfuse==5.0.4",
    "arxiv==4.0.1",
    "boto3==1.43.116",
    "gradio==6.30.0",
    "python-telegram-bot==22.8",
]

[project.optional-dependencies]
ingest = ["docling==2.141.0"]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["querymesh*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.logfire]
ignore_no_config = true
